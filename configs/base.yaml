# All parameters for the equity pipeline. An experiment is this file plus a git commit.
# Unknown keys are rejected at load time.

data:
  cache_dir: data/processed
  start: "2015-01-01"
  end: "2025-06-30"
  universe_file: configs/universe.csv
  min_history_days: 750       # drop names with less usable history
  max_missing_pct: 0.02       # drop names missing more than 2% of bars

pairs:
  formation_window_days: 504  # ~2 years to pick pairs on
  adf_pvalue_max: 0.05
  min_half_life_days: 2       # faster is noise at daily bars
  max_half_life_days: 60      # slower ties up capital for little signal
  top_n_pairs: 20

hedge:
  method: kalman              # static | kalman
  kalman:
    delta: 1.0e-5             # how fast beta may drift; 0 is static OLS
    obs_var: 1.0e-3
    spread_mode: innovation   # innovation | residual
  static:
    refit_every_days: 63

signals:
  zscore_window: 60
  entry_z: 2.0
  exit_z: 0.5
  stop_z: 3.5
  max_holding_days: 40

backtest:
  initial_capital: 1_000_000
  gross_per_pair: 0.10        # 10% of capital per pair, both legs together
  execution_lag_bars: 1       # signal at close t, trade at close t+1
  max_gross_leverage: 2.0
  costs:
    commission_bps: 1.0       # per side
    half_spread_bps: 2.5      # per side
    borrow_fee_annual_bps: 50 # on the short leg

capacity:
  impact_coef: 0.1            # k in impact = k * sigma * sqrt(Q / ADV)
  adv_window_days: 21
  aum_grid: [1e6, 5e6, 1e7, 2.5e7, 5e7, 1e8, 2.5e8, 5e8, 1e9]

validation:
  walkforward:
    formation_days: 504
    trading_days: 126
    step_days: 126
  n_trials: 1                 # configs tried, multiplied into the DSR
  regimes:
    covid_crash: ["2020-02-15", "2020-04-30"]
    rate_shock_2022: ["2022-01-01", "2022-10-31"]
    banking_stress_2023: ["2023-03-01", "2023-05-31"]

output_dir: results
